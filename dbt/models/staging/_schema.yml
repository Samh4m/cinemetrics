version: 2

models:
  - name: stg_movies
    description: "Cleaned, renamed view of the TMDB discover endpoint. One row per movie ingested into raw_movies_discover."
    columns:
      - name: movie_id
        description: "TMDB's internal movie ID. Unique per movie."
        tests:
          - not_null
          - unique

      - name: title
        description: "Display title of the movie."
        tests:
          - not_null

      - name: release_date
        description: "Primary release date as recorded by TMDB."
        # No not_null — TMDB allows missing release dates for some entries.

      - name: vote_average
        description: "Average user rating, 0.0 to 10.0."
        tests:
          - not_null
          # Custom-bounded check via dbt_utils or a singular test would be nice later.

      - name: vote_count
        description: "Number of user votes contributing to vote_average."
        tests:
          - not_null

      - name: original_language
        description: "ISO 639-1 language code of the original release."
        tests:
          - not_null

      - name: is_adult
        description: "TMDB's adult-content flag."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]