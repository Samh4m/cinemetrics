[project]
name = "cinemetrics"
version = "0.1.0"
description = "End to end data enigneering pipeline for movie and tv analytics. Ingests TMDB data, transforms via dbt, deploys to AWS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dbt-core>=1.11.9",
    "dbt-duckdb>=1.10.1",
    "duckdb>=1.5.2",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.target.wheel]
packages = ["src/cinemetrics"]
